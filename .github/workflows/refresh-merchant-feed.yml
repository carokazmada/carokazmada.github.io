name: Refresh Carokaz Merchant Center feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feed branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Refresh from Shopify when token is available
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_SHOP: carokazmada-store.myshopify.com
          SHOPIFY_API_VERSION: "2025-07"
        run: |
          if [ -z "$SHOPIFY_ADMIN_TOKEN" ]; then
            echo "SHOPIFY_ADMIN_TOKEN absent; keeping the last validated snapshot."
            exit 0
          fi
          python scripts/generate_merchant_feed.py

      - name: Create pull request when the feed changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- feeds/carokaz-merchant-mg.xml; then
            echo "No feed changes."
            exit 0
          fi
          branch="automation/merchant-feed-${GITHUB_RUN_ID}"
          git config user.name "carokaz-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "$branch"
          git add feeds/carokaz-merchant-mg.xml
          git commit -m "chore: refresh vehicle Merchant Center feed"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: refresh vehicle Merchant Center feed" \
            --body "Automated feed refresh from the active Shopify vehicle inventory. Please review before merging into the protected main branch."
