name: Security baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject tracked secret-like files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -z | grep -zE '(^|/)(\.env($|\.)|.*(secret|credential|private|service-account|\.pem|\.key))' >/dev/null; then
            echo 'A secret-like file is tracked.' >&2
            exit 1
          fi
      - name: Reject obvious credential literals
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E 'AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----' -- ':!*.svg' ':!*.min.js'; then
            echo 'An apparent credential literal was found.' >&2
            exit 1
          fi
